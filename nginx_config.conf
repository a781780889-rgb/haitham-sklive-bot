# nginx_config.conf - تكوين Nginx للإنتاج
# ضع هذا الملف في: /etc/nginx/sites-available/seha

# إعادة توجيه HTTP إلى HTTPS
server {
    listen 80;
    server_name your-domain.com www.your-domain.com;
    return 301 https://$server_name$request_uri;
}

# HTTPS Server - Web Interface
server {
    listen 443 ssl http2;
    server_name your-domain.com www.your-domain.com;

    # شهادات SSL (استخدم Let's Encrypt)
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;

    # السجلات
    access_log /var/log/nginx/seha_access.log;
    error_log /var/log/nginx/seha_error.log;

    # حد الحجم
    client_max_body_size 10M;

    # الموقع الرئيسي
    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # WebSocket support (إذا لزم الأمر)
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # الملفات الثابتة
    location /static {
        alias /path/to/enhanced_bot/static;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

# API Server (داخلي فقط - لا يمكن الوصول إليه من الخارج)
server {
    listen 127.0.0.1:5001;
    server_name localhost;

    location / {
        proxy_pass http://127.0.0.1:5001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        
        # تقييد الوصول بـ IP (اختياري)
        # allow 127.0.0.1;
        # deny all;
    }
}

# تكوينات الأمان الإضافية
add_header X-Frame-Options "SAMEORIGIN" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-XSS-Protection "1; mode=block" always;
add_header Referrer-Policy "no-referrer-when-downgrade" always;
