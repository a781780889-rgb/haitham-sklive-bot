##############################################################
# Nginx Config — sehasaa.com
# (للنشر على VPS — لا يلزم على Railway)
# ضع هذا الملف في: /etc/nginx/sites-available/sehasaa.com
# ثم شغّل:
#   ln -s /etc/nginx/sites-available/sehasaa.com /etc/nginx/sites-enabled/
#   nginx -t && systemctl reload nginx
##############################################################

server {
    listen 80;
    server_name sehasaa.com www.sehasaa.com;

    # إعادة توجيه HTTP → HTTPS (فعّله بعد تثبيت SSL)
    # return 301 https://$host$request_uri;

    location / {
        proxy_pass         http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
    }
}

