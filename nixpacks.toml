[phases.setup]
nixPkgs = [
  "python311",
  "python311Packages.pip",
  "cairo",
  "pango",
  "gdk-pixbuf",
  "libffi",
  "gobject-introspection",
  "harfbuzz",
  "fontconfig",
  "zlib"
]

[phases.install]
cmds = ["python3 -m pip install --upgrade pip", "python3 -m pip install -r requirements.txt"]

[start]
cmd = "python3 bot.py"
